<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DRYFTQ</title>
    <script>
      // SPA fallback for GitHub Pages (which has no server-side rewrite rules).
      // GitHub serves this file for any unknown path; we forward to index.html
      // while keeping the clean URL (/dashboard, /analytics, …) intact.
      var pathSegmentsToKeep = 0; // set >0 if served from a repo sub-path
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
