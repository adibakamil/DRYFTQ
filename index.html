<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRYFTQ — Prevent the Unexpected | Industrial Intelligence</title>
    <meta
      name="description"
      content="DRYFTQ combines machine data, human insights and quantum intelligence to detect subtle process drift early — reducing downtime, waste and quality loss."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312161B'/%3E%3Cpath d='M10 8h5.5a8 8 0 010 16H10z' fill='%23FF5A1F'/%3E%3C/svg%3E"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA restore — pairs with 404.html. If we arrived at a
      // clean route via the 404 fallback, the path is encoded in the query
      // string as ?/dashboard; decode it back to a real URL before the router
      // (the module script below) reads location.pathname.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
